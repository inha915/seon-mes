# 프론트는 정적 배포, API 는 Netlify Function 하나로 실행
# 사이트 환경변수에 DATABASE_URL (Neon pooled 주소) 필요

[build]
  # prisma client 는 backend postinstall 에서 생성됨
  command = "npm run build -w frontend"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  # lambda 엔진이 빠지지 않게 명시
  included_files = [
    "node_modules/.prisma/client/schema.prisma",
    "node_modules/.prisma/client/libquery_engine-rhel-openssl-3.0.x.so.node",
  ]

# 함수 번들 크기 줄이기 (netlify/plugins/slim-function-deps)
[[plugins]]
  package = "/netlify/plugins/slim-function-deps"

# /api → 함수
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
