name: seon-mes

services:
  db:
    image: postgres:16-alpine
    container_name: seon-mes-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: seon
      POSTGRES_PASSWORD: seon_dev_pw
      POSTGRES_DB: seon_mes
    ports:
      - "5433:5432"
    volumes:
      - seon-mes-pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/10-init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seon -d seon_mes"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  seon-mes-pgdata:
